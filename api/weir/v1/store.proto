syntax = "proto3";

package weir.v1;

option go_package = "github.com/batchstream/weir-protocol/api/weir/v1;weirv1";

// Requests and responses reject unknown fields recursively. Responses require
// recognized results/events and enum values.

// StoreService executes requests on a Weir server that hosts the named Store.
// A server that does not host the Store fails the RPC with NOT_FOUND.
service StoreService {
  // Execute accepts requests and emits indexed results incrementally.
  // A stream selects one Store and operation kind. Each Read or Mutate request
  // carries one record with a consecutive one-based index. It is validated
  // before execution; earlier records may have effects before a later one fails.
  // Mutations to the same resource preserve input order across requests, including
  // after item failures. Different resources may execute concurrently. A stream
  // is not a transaction; ordering across streams follows database semantics.
  // Never automatically replay mutations without individual application evidence.
  // Native accepts exactly one request with index 1 followed by half-close and
  // streams opaque response metadata, body chunks, and transport completion.
  rpc Execute(stream ExecuteRequest) returns (stream ExecuteResponse);
}

// ExecuteRequest binds one operation to its Store and index.
message ExecuteRequest {
  // Store that owns all resources; must remain identical throughout the stream.
  string store_name = 1;

  // Consecutive one-based record ordinal. Each Read or Mutate request advances
  // it by one. Native always uses 1. UINT64_MAX is invalid.
  uint64 index = 2;

  // Required operation; its kind must remain identical throughout the stream.
  Command command = 3;
}

// ExecuteResponse carries one result or streaming event.
message ExecuteResponse {
  // One-based input record ordinal; record results arrive in input order.
  // Every input record has exactly one result. Native events all use 1.
  uint64 index = 1;

  // Required typed event; it must match the stream's operation kind.
  Event event = 2;
}

// Command selects one operation with incrementally delivered results.
message Command {
  // Exactly one operation is required.
  oneof operation {
    // Read one resource and return its indexed ReadResult.
    ReadRequest read = 1;

    // Mutate one resource and return its indexed MutationResult.
    MutateRequest mutate = 2;

    // Execute an adapter-owned operation with an opaque request body.
    NativeRequest native = 3;
  }
}

// NativeRequest supplies an adapter-owned operation with its complete input.
message NativeRequest {
  // Optional canonical target prefix relative to the selected Store. Empty
  // selects the backend root when supported by its target grammar. Native has
  // no command, path, or parameter allowlist; backend permissions apply.
  string resource = 1;

  // Required opaque request document. Backend protocol limits apply.
  // The adapter interprets content_type and data; empty data is permitted.
  Document request = 2;
}

// Event is a per-record result or a Native head/body/end event.
message Event {
  // Exactly one event value is required.
  oneof value {
    // Result for the ReadRequest identified by ExecuteResponse.index.
    ReadResult read_result = 1;

    // Application evidence for the MutateRequest identified by the response index.
    MutationResult mutation_result = 2;

    // Native response metadata, delivered before response body chunks.
    NativeHead head = 3;

    // Nonempty opaque fragment of the Native response body.
    bytes chunk = 4;

    // Terminal evidence of Native response transport completion.
    NativeEnd native_end = 5;
  }
}

// Empty is an explicit marker for a missing document or a delete action.
message Empty {}

// Document binds opaque bytes to an explicit content type; adapters own their format.
message Document {
  // Required MIME media type without parameters.
  string content_type = 1;

  // Opaque payload bytes interpreted by the selected backend.
  bytes data = 2;
}

// FailureCode classifies operation failures independently of backend error types.
// Only declared nonzero values are valid. Failure classification never overrides
// the separate application/transport evidence or establishes retry safety.
enum FailureCode {
  // Unset value; invalid in a reported Failure.
  FAILURE_CODE_UNSPECIFIED = 0;

  // Input violates the request or adapter contract.
  INVALID_ARGUMENT = 1;

  // Required authentication could not be established.
  UNAUTHENTICATED = 2;

  // The caller or configured backend identity lacks access.
  PERMISSION_DENIED = 3;

  // The required adapter-owned target does not exist. A missing document
  // is a successful ReadResult.missing or a mutation precondition failure.
  TARGET_NOT_FOUND = 4;

  // The target does not satisfy an operation precondition.
  PRECONDITION_FAILED = 5;

  // A conflicting concurrent operation prevented this operation.
  CONFLICT = 6;

  // The adapter does not support the requested operation or option.
  UNSUPPORTED = 7;

  // An input, output, or execution budget was exceeded.
  RESOURCE_EXHAUSTED = 8;

  // A required service or transport is unavailable.
  UNAVAILABLE = 9;

  // The request was cancelled.
  CANCELLED = 10;

  // The request's deadline expired.
  DEADLINE_EXCEEDED = 11;

  // An execution or response invariant failed.
  INTERNAL = 12;
}

// MutationOutcome describes application evidence, not whether an error occurred.
// Its vocabulary is fixed; unknown values are invalid completion evidence.
enum MutationOutcome {
  // Unset value; invalid in a reported MutationResult.
  MUTATION_OUTCOME_UNSPECIFIED = 0;

  // The mutation was not started against the backend.
  NOT_STARTED = 1;

  // Execution established that the mutation was not applied.
  NOT_APPLIED = 2;

  // Execution established that the requested semantics were satisfied, including
  // a successful no-op such as deleting a document that was already absent.
  APPLIED = 3;

  // Available evidence cannot establish whether the mutation was applied.
  UNKNOWN = 4;
}

// Failure carries one readable description of an operation failure.
message Failure {
  // Required declared nonzero failure classification.
  FailureCode code = 1;

  // UTF-8 diagnostic text; clients must use code for programmatic decisions.
  string message = 2;
}

// ReadRequest reads one document using the owning adapter's resource grammar.
message ReadRequest {
  // Canonical path relative to the selected Store; no scheme or leading slash.
  string resource = 1;
}

// ReadResult distinguishes a returned document, absence, and an execution failure.
message ReadResult {
  // Exactly one result is required.
  oneof result {
    // The requested document was found.
    Document document = 1;

    // The read succeeded and the requested document does not exist.
    Empty missing = 2;

    // The read could not produce a document or reliable absence evidence.
    Failure failure = 3;
  }
}

// MutationVisibility selects the completion condition for every mutation action.
enum MutationVisibility {
  // Confirm that the requested mutation semantics were applied.
  APPLICATION_ACKNOWLEDGED = 0;

  // Also confirm visibility to subsequent normal queries before returning success.
  QUERY_VISIBLE = 1;
}

// MutationOptions applies uniformly to writes, deletes and atomic transforms.
message MutationOptions {
  // APPLICATION_ACKNOWLEDGED is the default. QUERY_VISIBLE establishes
  // visibility to subsequent normal queries, including for no-ops. Search
  // adapters wait for refresh; backends without deferred query visibility
  // satisfy this once the mutation is acknowledged. APPLIED with Failure
  // retains application evidence but does not confirm query visibility.
  MutationVisibility visibility = 1;
}

// MutateRequest applies one action to one resource using adapter-owned semantics.
message MutateRequest {
  // Canonical path relative to the selected Store; no scheme or leading slash.
  string resource = 1;

  // Exactly one mutation action is required.
  oneof action {
    // Create or replace the resource with this document.
    Document put = 2;

    // Create the resource only when it does not already exist.
    Document create = 3;

    // Replace an existing resource with this document.
    Document replace = 4;

    // Delete the resource.
    Empty delete = 5;

    // Apply Lua source or a backend expression atomically to the resource.
    Transform atomic_transform = 6;
  }

  // Optional completion settings shared by every mutation action. Absent uses
  // APPLICATION_ACKNOWLEDGED. Unknown option fields or enum values are invalid.
  MutationOptions options = 7;
}

// MutationResult reports the known application outcome and any associated failure.
message MutationResult {
  // Required application evidence; UNKNOWN must never trigger automatic replay.
  MutationOutcome outcome = 1;

  // Required unless APPLIED. APPLIED may still report an acknowledgement failure.
  Failure failure = 2;
}

// Transform selects Lua or a native backend expression for one atomic mutation.
message Transform {
  // Exactly one transform form is required.
  oneof form {
    // Lua operating on the current document or nil when absent.
    LuaTransform lua = 1;

    // Opaque expression interpreted and validated by the backend adapter.
    Document backend_expression = 2;
  }
}

// LuaTransform supplies source code and optional input with Lua 5.4 semantics.
// Source returns one function(current, incoming), using ordinary document tables.
// Missing current or omitted Input is nil. The callback returns exactly one
// object to replace/create, or weir.keep(), weir.delete(), or weir.reject(message).
// Keep/delete on a missing document are successful no-ops; reject is
// NOT_APPLIED/PRECONDITION_FAILED. Nil, arrays, scalars, and missing/multiple
// callback returns are invalid. A callback error or invalid result never writes.
// Null is weir.null(); object/array tables and exact signed 64-bit integers retain
// their document kinds. Helpers and conversion rules are part of this contract.
// Source, entry point, return actions, and Lua semantics have no runtime selector.
message LuaTransform {
  // Nonempty UTF-8 source code; precompiled bytecode is not accepted.
  bytes source = 1;

  // Optional input document made available to the program.
  Document input = 2;
}

// NativeCompletion reports response transport evidence, never mutation outcomes.
// Its vocabulary is fixed; unknown values are invalid completion evidence.
enum NativeCompletion {
  // Unset value; invalid in a reported NativeEnd.
  NATIVE_COMPLETION_UNSPECIFIED = 0;

  // The native operation was not started against the backend.
  NATIVE_NOT_STARTED = 1;

  // The native response was received completely.
  RESPONSE_COMPLETE = 2;

  // The native operation started but its response was not received completely.
  RESPONSE_INCOMPLETE = 3;
}

// NativeHead describes the native response before any body chunks are delivered.
message NativeHead {
  // Optional adapter-owned response metadata.
  // Its content type and bytes are opaque to the public protocol.
  Document metadata = 1;

  // MIME type of following body chunks; empty when no type was supplied.
  string body_content_type = 2;
}

// NativeEnd closes the response transport and reports any incomplete exchange.
message NativeEnd {
  // Required completion evidence; it does not prove whether writes were applied.
  NativeCompletion completion = 1;

  // Required unless RESPONSE_COMPLETE; complete responses have no transport failure.
  Failure failure = 2;
}
