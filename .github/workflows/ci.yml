name: Public protocol CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: protocol-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GOENV: 'off'
      GOWORK: 'off'
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version: '1.27.1'
          cache: true
      - run: go mod download
      - name: Offline validation
        env:
          GOPROXY: 'off'
          GOSUMDB: 'off'
        run: |
          go mod verify
          go test -race -count=1 -timeout=90s ./...
          go vet ./...
          python3 scripts/check_dependencies.py
          python3 -m unittest discover -s scripts -p '*_test.py' -v
          test -z "$(gofmt -l .)"
          git diff --exit-code
