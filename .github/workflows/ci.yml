name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: The protocol depends on neither the server nor the SDK
        run: |
          forbidden=$(go list -m -f '{{if or (eq .Path "github.com/batchstream/weir") (eq .Path "github.com/batchstream/weir-go")}}{{.Path}}{{end}}' all)
          echo "$forbidden"
          test -z "$forbidden"
      - name: Tests, vet and formatting
        run: |
          go mod tidy -diff
          go test -race -count=1 -timeout=90s ./...
          go vet ./...
          test -z "$(gofmt -l .)"
